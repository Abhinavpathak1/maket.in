<!DOCTYPE html>
<html>
  <head>
    <title>Account Page</title>

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link rel="stylesheet" href="account.css" />


  </head>

  <body>

    <div class="js-container"></div>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

      /* ================= HEADER ================= */

      function Header() {

        return (

          <div className="vertical-containerheader">

            <div className="logo">

              <h2>Market.in</h2>

              <p>Delivering the best products</p>

            </div>

            <select className="se">

              <option>All</option>
              <option>Electronics</option>
              <option>Clothing</option>
              <option>Home</option>

            </select>

            <form className="search-form">

              <input
                type="text"
                placeholder="Search products..."
              />

              <button type="submit">
                Search
              </button>

            </form>

            <select className="se">

              <option>India</option>
              <option>USA</option>

            </select>

            <button className="se">
              Login
            </button>

            <button className="se">
              Returns & Orders
            </button>

          </div>
        );
      }

      /* ================= OPTION ================= */

      function Option() {

        const [isOpen, setIsOpen] =
          React.useState(false);

        const links = [
          { name: "MX Player", path: "#" },
          { name: "Mobiles", path: "#" },
          { name: "Fashion", path: "#" },
          { name: "Books", path: "#" },
          { name: "Home", path: "#" }
        ];

        return (
          <>

            <div className="vertical-containerheader2">

              <button
                className="menu-btn"
                onClick={() => setIsOpen(true)}
              >
                All
              </button>

              <div className="top-links">

                {links.map((link, index) => (

                  <button
                    key={index}
                    onClick={() =>
                      window.location.href = link.path
                    }
                  >
                    {link.name}
                  </button>

                ))}

              </div>

            </div>

            {/* Overlay */}
            {isOpen && (

              <div
                className="overlay"
                onClick={() => setIsOpen(false)}
              ></div>

            )}

            {/* Sidebar */}
            <div
              className={
                `side-menu ${isOpen ? "open" : ""}`
              }
            >

              <div className="top">

                <button
                  onClick={() => setIsOpen(false)}
                >
                  X
                </button>

                <h2>Hello User</h2>

              </div>

              <div className="side-menu-content">

                <h3>Trending</h3>

                <a href="#">Best Sellers</a>
                <a href="#">New Releases</a>
                <a href="#">Movers and Shakers</a>

                <h3>Digital Content</h3>

                <a href="#">Prime Video</a>
                <a href="#">Amazon Music</a>
                <a href="#">App Store</a>

                <h3>Shop by Category</h3>

                <a href="#">Mobiles</a>
                <a href="#">Fashion</a>
                <a href="#">Books</a>
                <a href="#">Home</a>

                <h3>Help & Settings</h3>

                <a href="#">Your Account</a>
                <a href="#">Customer Service</a>
                <a href="#">Sign In</a>

              </div>

            </div>

          </>
        );
      }

      /* ================= CARD ================= */

      function Card() {

  const cards = [

    {
      img:
        "https://cdn-icons-png.flaticon.com/512/891/891462.png",

      title:
        "Your Orders",

      text:
        "Track, return, or buy things",

      link:
        "../order/order.html"
    },

    {
      img:
        "https://cdn-icons-png.flaticon.com/512/3064/3064197.png",

      title:
        "Login & Security",

      text:
        "Edit login, name, and mobile number",

      link:
        "../security/security.html"
    },

    {
      img:
        "https://cdn-icons-png.flaticon.com/512/5968/5968260.png",

      title:
        "Prime",

      text:
        "View benefits and payment settings",

      link:
        "../prime/prime.html"
    },

    {
      img:
        "https://cdn-icons-png.flaticon.com/512/684/684908.png",

      title:
        "Your Address",

      text:
        "Manage delivery addresses",

      link:
        "../address/address.html"
    },

    {
      img:
        "https://cdn-icons-png.flaticon.com/512/2920/2920277.png",

      title:
        "Your Business Account",

      text:
        "Save up to 18% with GST invoice and bulk discounts",

      link:
        "../business/business.html"
    },

    {
      img:
        "https://cdn-icons-png.flaticon.com/512/2331/2331941.png",

      title:
        "Payment Options",

      text:
        "Edit or add payment methods",

      link:
        "../payment/payment.html"
    },

    {
      img:
        "https://cdn-icons-png.flaticon.com/512/597/597177.png",

      title:
        "Contact Us",

      text:
        "Contact customer service via phone or chat",

      link:
        "../contact/contact.html"
    }

  ];

  return (

    <div className="card-container">

      {cards.map((item, index) => (

        <a
          href={item.link}
          className="card-link"
          key={index}
        >

          <div className="card-box">

            <img
              src={item.img}
              alt={item.title}
            />

            <h4>
              {item.title}
            </h4>

            <p>
              {item.text}
            </p>

          </div>

        </a>

      ))}

    </div>
  );
}
/* ================= INFO ================= */

function Info() {

  return (

    <>

      <div className="back-top">

        <button
          onClick={() =>
            window.scrollTo({
              top: 0,
              behavior: "smooth"
            })
          }
        >
          Back to top
        </button>

      </div>

      <div className="info">

        <div className="link">

          <h2>Get to know us</h2>

          <a href="#">
            About
          </a>

          <a href="#">
            Careers
          </a>

          <a href="#">
            Press Releases
          </a>

        </div>

        <div className="link">

          <h2>Connect with us</h2>

          <a href="#">
            Instagram
          </a>

          <a href="#">
            Facebook
          </a>

          <a href="#">
            Twitter
          </a>

        </div>

        <Link />

      </div>

    </>
  );
}
      /* ================= LINKS ================= */

      function Link() {

        return (

          <div className="link">

            <h2>Services</h2>

            <a href="#">Market Pay</a>
            <a href="#">Audible</a>
            <a href="#">Gift Cards</a>

          </div>
        );
      }

      /* ================= FOOTER ================= */

      function Footer() {

        return (

          <div id="footer">

            © 2026 Market.in

          </div>
        );
      }

      /* ================= APP ================= */

      function App() {

        return (
          <>

            <Header />

            <Option />

            <Card />

            <Info />

            <Footer />

          </>
        );
      }

      /* ================= RENDER ================= */

      const root =
        ReactDOM.createRoot(
          document.querySelector(".js-container")
        );

      root.render(<App />);

    </script>

  </body>
</html>
