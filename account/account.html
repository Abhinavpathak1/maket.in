<!DOCTYPE html>
<html>
  <head>
    <title>Account Page</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="account.css" />
  </head>

  <body>
    <div class="js-container"></div>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

      /* ================= HEADER ================= */

      function Header() {
        return (
          <div className="vertical-containerheader">

            <div className="logo">
              <h2>Market.in</h2>
              <p>delivering the best products</p>
            </div>

            <select className="se">
              <option>All</option>
              <option>Electronics</option>
              <option>Clothing</option>
              <option>Home</option>
            </select>

            <form className="search-form">
              <input
                type="text"
                placeholder="Search products..."
              />

              <button type="submit">
                Search
              </button>
            </form>

            <select className="se">
              <option>India</option>
              <option>USA</option>
            </select>

            <button className="se">Login</button>
            <button className="se">Returns & Orders</button>

          </div>
        );
      }

      /* ================= OPTION ================= */

      function Option() {

        const [isOpen, setIsOpen] = React.useState(false);

        const links = [
          { name: "MX Player", path: "/mx-player" },
          { name: "Mobiles", path: "/mobiles" },
          { name: "Fashion", path: "/fashion" },
          { name: "Books", path: "/books" },
          { name: "Home", path: "/home" }
        ];

        return (
          <>
            <div className="vertical-containerheader2">

              <button
                className="menu-btn"
                onClick={() => setIsOpen(true)}
              >
                All
              </button>

              {/* Top Menu */}
              <div className="top-links">
                {links.map((link) => (
                  <button
                    key={link.path}
                    onClick={() => window.location.href = link.path}
                  >
                    {link.name}
                  </button>
                ))}
              </div>

            </div>

            {/* Overlay */}
            {isOpen && (
              <div
                className="overlay"
                onClick={() => setIsOpen(false)}
              ></div>
            )}

            {/* Sidebar */}
            <div className={`side-menu ${isOpen ? "open" : ""}`}>

              <div className="top">
                <button onClick={() => setIsOpen(false)}>
                  X
                </button>

                <h2>Hello User</h2>
              </div>

              <div className="side-menu-content">

                <h3>Trending</h3>

                <a href="#">Best Sellers</a>
                <a href="#">New Releases</a>
                <a href="#">Movers and Shakers</a>

                <h3>Digital Content</h3>

                <a href="#">Prime Video</a>
                <a href="#">Amazon Music</a>
                <a href="#">App Store</a>

                <h3>Shop by Category</h3>

                <a href="#">Mobiles</a>
                <a href="#">Fashion</a>
                <a href="#">Books</a>
                <a href="#">Home</a>

                <h3>Help & Settings</h3>

                <a href="#">Your Account</a>
                <a href="#">Customer Service</a>
                <a href="#">Sign In</a>

              </div>

            </div>
          </>
        );
      }

      /* ================= LOGBOARD ================= */

      function Logbord({ title, products }) {

        return (
          <div id="logbord">

            <h2>{title}</h2>

            <div className="logboard-images">

              {products.map((item, index) => (
                <img
                  key={index}
                  src={item}
                  alt="product"
                />
              ))}

            </div>

          </div>
        );
      }

      /* ================= CARD ================= */

      function Card() {

        const [user, setUser] = React.useState({
          name: "Rahul Sharma",
          email: "rahul@gmail.com",
          mobile: "9876543210",
          address: "Mumbai, India",
          dob: "12/08/2001"
        });

        function handleEdit() {

          const newName = prompt("Enter new name", user.name);

          if (newName) {
            setUser({
              ...user,
              name: newName
            });
          }
        }

        return (
          <div className="card">

            <img
              className="profile-img"
              src="https://via.placeholder.com/150"
              alt="Profile"
            />

            <h2>{user.name}</h2>

            <p>Email: {user.email}</p>

            <p>Mobile: {user.mobile}</p>

            <p>Address: {user.address}</p>

            <p>DOB: {user.dob}</p>

            <button onClick={handleEdit}>
              Edit Profile
            </button>

            <div className="history-section">

              <p className="section-title">
                Order History
              </p>

              <Logbord
                title="Previous Orders"
                products={[
                  "https://via.placeholder.com/100",
                  "https://via.placeholder.com/100",
                  "https://via.placeholder.com/100",
                  "https://via.placeholder.com/100",
                  "https://via.placeholder.com/100"
                ]}
              />

              <p className="section-title">
                Suggested For You
              </p>

              <Logbord
                title="Recommended Products"
                products={[
                  "https://via.placeholder.com/100",
                  "https://via.placeholder.com/100",
                  "https://via.placeholder.com/100",
                  "https://via.placeholder.com/100",
                  "https://via.placeholder.com/100"
                ]}
              />

            </div>

          </div>
        );
      }

      /* ================= INFO ================= */

      function Info() {

        return (
          <>
            <div className="back-top">
              <button>
                Back to top
              </button>
            </div>

            <div className="info">

              <div className="link">

                <h2>Get to know us</h2>

                <a href="#">About</a>
                <a href="#">Careers</a>
                <a href="#">Press Releases</a>

              </div>

              <div className="link">

                <h2>Connect</h2>

                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">Twitter</a>

              </div>

              <Link />

            </div>
          </>
        );
      }

      /* ================= LINKS ================= */

      function Link() {

        return (
          <div className="link">

            <h2>Services</h2>

            <a href="#">Market Pay</a>
            <a href="#">Audible</a>
            <a href="#">Gift Cards</a>

          </div>
        );
      }

      /* ================= FOOTER ================= */

      function Footer() {

        return (
          <div id="footer">
            © 2026 Market.in
          </div>
        );
      }

      /* ================= APP ================= */

      function App() {

        return (
          <>
            <Header />

            <Option />

            <Card />

            <div className="info-footer">
              <Info />
            </div>

            <Footer />
          </>
        );
      }

      /* ================= RENDER ================= */

      const root = ReactDOM.createRoot(
        document.querySelector(".js-container")
      );

      root.render(<App />);

    </script>
  </body>
</html>
