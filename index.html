/* ================= OPTION ================= */
function Option() {
  const [isOpen, setIsOpen] = React.useState(false);

  const links = [
    { name: "MX Player", path: "/mx-player" },
    { name: "Mobiles", path: "/mobiles" },
    { name: "Fashion", path: "/fashion" },
    { name: "Books", path: "/books" },
    { name: "Home", path: "/home" },
    { name: "Electronics", path: "/electronics" }
    
  ];

  return (
    <>
      <div className="vertical-containerheader2">

        <button onClick={() => setIsOpen(true)}>All</button>

        {isOpen && (
          <div className="overlay" onClick={() => setIsOpen(false)}> </div>
        )}

        <div className={`side-menu ${isOpen ? "open" : ""}`}>

              <a href="/mx-player"><div>amazon music</div></a>
              <a href="/mx-player"><div>app store</div></a>
              <a href="/mx-player"><div>prime reading</div></a>
              <h3>shop by category</h3>
              <a href="/mobiles"><div>mobiles</div></a>
              <a href="/fashion"><div>fashion</div></a>
              <a href="/books"><div>books</div></a>
              <a href="/home"><div>home</div></a>
              <a href="/home"><div>electronics</div></a>
              <h3>programs and features</h3>
              <a href="/mx-player"><div>gift cards</div></a>
              <a href="/mx-player"><div>amazon pay</div></a>
              <a href="/mx-player"><div>amazon pay icici credit card</div></a>
              <a href="/mx-player"><div>sell on market.in</div></a>
              <h3>help and settings</h3>
              <a href="account/account.html"><div>your account</div></a>
              <a href="custoreserves/custoreserves.html"><div>customer service</div></a>
              <a href= "Login/login.html"><div>log in</div></a>

           </div>

          <button

          >
            {link.name}
          </button>
        ))}
      </div>
      </div>
    </>
  );
}
/* ================= SHOPCARD ================= */
function Shopcard({category, image, img2, img3, img4, end, link}){
  return(
    <div id="shopcard">
      <h2>{category}</h2>
      <img src={image} alt="" />
      <img src={img2} alt="" />
      <img src={img3} alt="" />
      <img src={img4} alt="" />
      <a href={link}>{end}</a>
    </div>
  );
}

}
