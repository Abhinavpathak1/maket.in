<!DOCTYPE html>
<html>
  <head>
    <title>Signup Page</title>

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <link rel="stylesheet" href="signup.css" />
  </head>

  <body>

    <div class="js-container"></div>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">

      /* ================= HEADER ================= */

      function Header() {

        return (
          <div className="vertical-containerheader">

            <div className="logo">
              <h2>Market.in</h2>
              <p>Delivering the best products</p>
            </div>

            <select className="se">
              <option>All</option>
              <option>Electronics</option>
              <option>Clothing</option>
              <option>Home</option>
            </select>

            <form className="search-form">
              <input
                type="text"
                placeholder="Search products..."
              />

              <button type="submit">
                Search
              </button>
            </form>

            <select className="se">
              <option>India</option>
              <option>USA</option>
            </select>

            <button className="se">
              Login
            </button>

            <button className="se">
              Returns & Orders
            </button>

          </div>
        );
      }

      /* ================= OPTION ================= */

      function Option() {

        const [isOpen, setIsOpen] = React.useState(false);

        const links = [
          { name: "MX Player", path: "#" },
          { name: "Mobiles", path: "#" },
          { name: "Fashion", path: "#" },
          { name: "Books", path: "#" },
          { name: "Home", path: "#" }
        ];

        return (
          <>
            <div className="vertical-containerheader2">

              <button
                className="menu-btn"
                onClick={() => setIsOpen(true)}
              >
                All
              </button>

              <div className="top-links">

                {links.map((link) => (
                  <button
                    key={link.name}
                    onClick={() => window.location.href = link.path}
                  >
                    {link.name}
                  </button>
                ))}

              </div>

            </div>

            {/* Overlay */}
            {isOpen && (
              <div
                className="overlay"
                onClick={() => setIsOpen(false)}
              ></div>
            )}

            {/* Sidebar */}
            <div className={`side-menu ${isOpen ? "open" : ""}`}>

              <div className="top">

                <button
                  onClick={() => setIsOpen(false)}
                >
                  X
                </button>

                <h2>Hello User</h2>

              </div>

              <div className="side-menu-content">

                <h3>Trending</h3>

                <a href="#">Best Sellers</a>
                <a href="#">New Releases</a>
                <a href="#">Movers and Shakers</a>

                <h3>Digital Content</h3>

                <a href="#">Prime Video</a>
                <a href="#">Amazon Music</a>
                <a href="#">App Store</a>

                <h3>Shop By Category</h3>

                <a href="#">Mobiles</a>
                <a href="#">Fashion</a>
                <a href="#">Books</a>
                <a href="#">Home</a>

                <h3>Help & Settings</h3>

                <a href="#">Your Account</a>
                <a href="#">Customer Service</a>
                <a href="#">Sign In</a>

              </div>

            </div>
          </>
        );
      }

      /* ================= SIGNUP CARD ================= */

     function Card() {

  const [formData, setFormData] = React.useState({
    name: "",
    email: "",
    password: "",
    mobile: "",
    date: "",
    gender: "",
    country: "",
    address: "",
    security: "",
    securityAnswer: ""
  });

  function handleChange(event) {

    const { name, value } = event.target;

    setFormData({
      ...formData,
      [name]: value
    });
  }

  async function handleSubmit(event) {

    event.preventDefault();

    try {

      const response = await fetch(
        'http://localhost:3000/api/register',
        {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify(formData)
        }
      );

      const data = await response.json();

      if (response.ok) {

        alert(
          "Signup Successful!\n\n" +
          "Name: " + formData.name +
          "\nEmail: " + formData.email
        );

        setFormData({
          name: "",
          email: "",
          password: "",
          mobile: "",
          date: "",
          gender: "",
          country: "",
          address: "",
          security: "",
          securityAnswer: ""
        });

      } else {

        alert(data.message || "Registration failed");

      }

    } catch (error) {

      console.error(error);

      alert("Server Error");

    }
  }

  return (

    <div className="vertical-container4">

      <div className="signup-container">

        <form
          className="signup-card"
          onSubmit={handleSubmit}
        >

          <h1>Create Account</h1>

          <label>Name</label>

          <input
            type="text"
            name="name"
            placeholder="Enter Name"
            value={formData.name}
            onChange={handleChange}
            required
          />

          <label>Email</label>

          <input
            type="email"
            name="email"
            placeholder="Enter Email"
            value={formData.email}
            onChange={handleChange}
            required
          />

          <label>Password</label>

          <input
            type="password"
            name="password"
            placeholder="Enter Password"
            value={formData.password}
            onChange={handleChange}
            required
          />

          <label>Mobile Number</label>

          <input
            type="number"
            name="mobile"
            placeholder="Enter Mobile Number"
            value={formData.mobile}
            onChange={handleChange}
            required
          />

          <label>Date of Birth</label>

          <input
            type="date"
            name="date"
            value={formData.date}
            onChange={handleChange}
            required
          />

          <label>Gender</label>

          <select
            name="gender"
            value={formData.gender}
            onChange={handleChange}
            required
          >
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
          </select>

          <label>Country</label>

          <select
            name="country"
            value={formData.country}
            onChange={handleChange}
            required
          >
            <option value="">Select Country</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="australia">Australia</option>
          </select>

          <label>Profile Photo</label>

          <input
            type="file"
            name="photo"
            accept="image/*"
          />

          <label>Address</label>

          <textarea
            name="address"
            placeholder="Enter Address"
            value={formData.address}
            onChange={handleChange}
            required
          ></textarea>

          <label>Security Question</label>

          <select
            name="security"
            value={formData.security}
            onChange={handleChange}
            required
          >
            <option value="">Select a Security Question</option>
            <option value="pet">
              What is your pet's name?
            </option>

            <option value="school">
              What is your first school's name?
            </option>

            <option value="mother">
              What is your mother's maiden name?
            </option>
          </select>

          <input
            type="text"
            name="securityAnswer"
            placeholder="Enter Security Answer"
            value={formData.securityAnswer}
            onChange={handleChange}
            required
          />

          <label>

            <input
              type="checkbox"
              name="newsletter"
            />

            Subscribe to newsletter

          </label>

          <label>

            <input
              type="checkbox"
              name="terms"
              required
            />

            I agree to Terms & Conditions

          </label>

          <button type="submit">
            Sign Up
          </button>

        </form>

      </div>

    </div>
  );
}

      /* ================= INFO ================= */

      function Info() {

        return (
          <>
            <div className="back-top">
              <button>
                Back to top
              </button>
            </div>

            <div className="info">

              <div className="link">

                <h2>Get to know us</h2>

                <a href="#">About</a>
                <a href="#">Careers</a>

              </div>

              <div className="link">

                <h2>Connect</h2>

                <a href="#">Instagram</a>
                <a href="#">Facebook</a>

              </div>

              <Link />

            </div>
          </>
        );
      }

      /* ================= LINKS ================= */

      function Link() {

        return (
          <div className="link">

            <h2>Services</h2>

            <a href="#">Market Pay</a>
            <a href="#">Audible</a>
            <a href="#">Gift Cards</a>

          </div>
        );
      }

      /* ================= FOOTER ================= */

      function Footer() {

        return (
          <div id="footer">
            © 2026 Market.in
          </div>
        );
      }

      /* ================= APP ================= */

      function App() {

        return (
          <>
            <Header />

            <Option />

            <Card />

            <div className="info-footer">
              <Info />
            </div>

            <Footer />
          </>
        );
      }

      /* ================= RENDER ================= */

      const root = ReactDOM.createRoot(
        document.querySelector(".js-container")
      );

      root.render(<App />);

    </script>

  </body>
</html>
