<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Market.in Signup</title>

  <link
    rel="stylesheet"
    href="signup.css"
  />

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

</head>

<body>

  <div class="js-container"></div>

  <script type="text/babel">

    /* ================= HEADER ================= */

    function Header() {

      return (

        <div className="header">

          <div className="logo">

            <h1>Market.in</h1>

            <p>
              Delivering the best products
            </p>

          </div>

          <div className="header-buttons">

            <button>
              Login
            </button>

            <button>
              Orders
            </button>

          </div>

        </div>
      );
    }

    /* ================= OPTION ================= */

    function Option() {

      const [isOpen, setIsOpen] =
        React.useState(false);

      return (

        <>

          <div className="topbar">

            <button
              className="menu-btn"
              onClick={() => setIsOpen(true)}
            >
              ☰ All
            </button>

            <div className="top-links">

              <button>Mobiles</button>

              <button>Fashion</button>

              <button>Books</button>

              <button>Home</button>

            </div>

          </div>

          {
            isOpen && (

              <div
                className="overlay"
                onClick={() => setIsOpen(false)}
              >

                <div
                  className="sidebar"
                  onClick={(e) =>
                    e.stopPropagation()
                  }
                >

                  <button
                    className="close-btn"
                    onClick={() =>
                      setIsOpen(false)
                    }
                  >
                    ✕
                  </button>

                  <h2>Hello User</h2>

                  <a href="#">
                    Best Sellers
                  </a>

                  <a href="#">
                    New Releases
                  </a>

                  <a href="#">
                    Fashion
                  </a>

                  <a href="#">
                    Mobiles
                  </a>

                  <a href="#">
                    Books
                  </a>

                </div>

              </div>
            )
          }

        </>
      );
    }

    /* ================= SIGNUP CARD ================= */

    function SignupCard() {

      const [step, setStep] =
        React.useState(1);

      const [accountId, setAccountId] =
        React.useState("");

      const [formData, setFormData] =
        React.useState({

          /* Step 1 */
          name: "",
          email: "",
          password: "",

          /* Step 2 */
          mobile: "",
          gender: "",
          country: "",

          /* Step 3 */
          userType: "",
          preference: ""

        });

      /* ========== HANDLE CHANGE ========== */

      function handleChange(e) {

        const { name, value } = e.target;

        setFormData({

          ...formData,
          [name]: value

        });
      }

      /* ========== NEXT STEP ========== */

      function nextStep() {

        setStep(step + 1);
      }

      /* ========== PREVIOUS STEP ========== */

      function prevStep() {

        setStep(step - 1);
      }

      /* ========== FINAL SUBMIT ========== */

      async function handleSubmit(e) {

        e.preventDefault();

        try {

          const response = await fetch(
            "http://localhost:3000/api/register",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify(formData)

            }
          );

          const data =
            await response.json();

          if (response.ok) {

            alert(
              "Account Created Successfully!"
            );

            setAccountId(
              data.accountId
            );

            console.log(data);

          } else {

            alert(
              data.message ||
              "Signup Failed"
            );
          }

        } catch (error) {

          console.error(error);

          alert("Server Error");

        }
      }

      return (

        <div className="signup-wrapper">

          <div className="signup-card">

            <h1>
              Create Account
            </h1>

            <p>
              Join Market.in today
            </p>

            {/* STEP INDICATOR */}

            <div className="steps">

              <div
                className={
                  step >= 1
                    ? "active-step"
                    : "step"
                }
              >
                1
              </div>

              <div
                className={
                  step >= 2
                    ? "active-step"
                    : "step"
                }
              >
                2
              </div>

              <div
                className={
                  step >= 3
                    ? "active-step"
                    : "step"
                }
              >
                3
              </div>

            </div>

            <form onSubmit={handleSubmit}>

              {/* ================= STEP 1 ================= */}

              {
                step === 1 && (

                  <div className="form-section">

                    <input
                      type="text"
                      name="name"
                      placeholder="Enter Name"
                      value={formData.name}
                      onChange={handleChange}
                      required
                    />

                    <input
                      type="email"
                      name="email"
                      placeholder="Enter Email"
                      value={formData.email}
                      onChange={handleChange}
                      required
                    />

                    <input
                      type="password"
                      name="password"
                      placeholder="Enter Password"
                      value={formData.password}
                      onChange={handleChange}
                      required
                    />

                    <button
                      type="button"
                      onClick={nextStep}
                    >
                      Continue
                    </button>

                  </div>
                )
              }

              {/* ================= STEP 2 ================= */}

              {
                step === 2 && (

                  <div className="form-section">

                    <input
                      type="number"
                      name="mobile"
                      placeholder="Mobile Number"
                      value={formData.mobile}
                      onChange={handleChange}
                      required
                    />

                    <select
                      name="gender"
                      value={formData.gender}
                      onChange={handleChange}
                      required
                    >

                      <option value="">
                        Select Gender
                      </option>

                      <option value="male">
                        Male
                      </option>

                      <option value="female">
                        Female
                      </option>

                      <option value="other">
                        Other
                      </option>

                    </select>

                    <select
                      name="country"
                      value={formData.country}
                      onChange={handleChange}
                      required
                    >

                      <option value="">
                        Select Country
                      </option>

                      <option value="india">
                        India
                      </option>

                      <option value="usa">
                        USA
                      </option>

                    </select>

                    <div className="btn-group">

                      <button
                        type="button"
                        onClick={prevStep}
                      >
                        Back
                      </button>

                      <button
                        type="button"
                        onClick={nextStep}
                      >
                        Continue
                      </button>

                    </div>

                  </div>
                )
              }

              {/* ================= STEP 3 ================= */}

              {
                step === 3 && (

                  <div className="form-section">

                    <select
                      name="userType"
                      value={formData.userType}
                      onChange={handleChange}
                      required
                    >

                      <option value="">
                        User Type
                      </option>

                      <option value="seller">
                        Seller
                      </option>

                      <option value="buyer">
                        Buyer
                      </option>

                    </select>

                    <select
                      name="preference"
                      value={formData.preference}
                      onChange={handleChange}
                      required
                    >

                      <option value="">
                        Preference
                      </option>

                      <option value="mobile">
                        Mobile
                      </option>

                      <option value="fashion">
                        Fashion
                      </option>

                      <option value="sports">
                        Sports
                      </option>

                      <option value="kids">
                        Kids
                      </option>

                    </select>

                    <div className="btn-group">

                      <button
                        type="button"
                        onClick={prevStep}
                      >
                        Back
                      </button>

                      <button type="submit">
                        Create Account
                      </button>

                    </div>

                  </div>
                )
              }

            </form>

            {
              accountId && (

                <div className="success-box">

                  <h2>
                    Account Created
                  </h2>

                  <p>
                    Your Account ID
                  </p>

                  <div className="account-id">

                    {accountId}

                  </div>

                </div>
              )
            }

          </div>

        </div>
      );
    }

    /* ================= FOOTER ================= */

    function Footer() {

      return (

        <div className="footer">

          © 2026 Market.in

        </div>
      );
    }

    /* ================= APP ================= */

    function App() {

      return (

        <>

          <Header />

          <Option />

          <SignupCard />

          <Footer />

        </>
      );
    }

    /* ================= RENDER ================= */

    const root =
      ReactDOM.createRoot(
        document.querySelector(
          ".js-container"
        )
      );

    root.render(<App />);

  </script>

</body>

</html>
