<!DOCTYPE html>
<html>
<head>
  <title>Item Details</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="itemdetailes.css" />
</head>

<body>

  <div class="js-container"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">

    /* ================= HEADER ================= */

    function Header() {
      return (
        <div className="vertical-containerheader">

          <div className="logo-text">
            Market.in
          </div>

          <div className="logo-section">
            <img
              src="https://via.placeholder.com/60"
              alt="Logo"
            />

            <p>Delivering the best products</p>
          </div>

          <select className="se">
            <option>All</option>
            <option>Electronics</option>
            <option>Clothing</option>
            <option>Home</option>
          </select>

          <form className="search-form">
            <input
              type="text"
              placeholder="Search products..."
            />

            <button type="submit">
              Search
            </button>
          </form>

          <select className="se">
            <option>India</option>
            <option>USA</option>
          </select>

          <button className="se">Login</button>

          <button className="se">
            Returns & Orders
          </button>

          <img
            src="https://via.placeholder.com/40"
            alt="Cart"
          />

        </div>
      );
    }

    /* ================= OPTION ================= */

    function Option() {

      const [isOpen, setIsOpen] = React.useState(false);

      const links = [
        { name: "MX Player", path: "#" },
        { name: "Mobiles", path: "#" },
        { name: "Fashion", path: "#" },
        { name: "Books", path: "#" },
        { name: "Home", path: "#" }
      ];

      return (
        <>

          <div className="vertical-containerheader2">

            <button onClick={() => setIsOpen(true)}>
              All
            </button>

            {links.map((link) => (
              <button key={link.name}>
                {link.name}
              </button>
            ))}

          </div>

          {/* Overlay */}

          {isOpen && (
            <div
              className="overlay"
              onClick={() => setIsOpen(false)}
            ></div>
          )}

          {/* Sidebar */}

          <div className={`side-menu ${isOpen ? "open" : ""}`}>

            <div className="top">

              <button onClick={() => setIsOpen(false)}>
                X
              </button>

              <h2>Hello User</h2>

            </div>

            <div className="side-menu-content">

              <h3>Trending</h3>

              <a href="#">Best Sellers</a>
              <a href="#">New Releases</a>
              <a href="#">Movers and Shakers</a>

              <h3>Digital Content</h3>

              <a href="#">Prime Video</a>
              <a href="#">Music</a>
              <a href="#">App Store</a>

              <h3>Shop By Category</h3>

              <a href="#">Mobiles</a>
              <a href="#">Fashion</a>
              <a href="#">Books</a>
              <a href="#">Electronics</a>

            </div>

          </div>

        </>
      );
    }

    /* ================= ITEM DETAILS ================= */

    function Itemdetailes() {

      const images = [
        "https://via.placeholder.com/500x500?text=Image+1",
        "https://via.placeholder.com/500x500?text=Image+2",
        "https://via.placeholder.com/500x500?text=Image+3"
      ];

      const [mainImage, setMainImage] = React.useState(images[0]);

      const similarProducts = [
        {
          image: "https://via.placeholder.com/200",
          name: "Similar Product 1"
        },
        {
          image: "https://via.placeholder.com/200",
          name: "Similar Product 2"
        },
        {
          image: "https://via.placeholder.com/200",
          name: "Similar Product 3"
        }
      ];

      const features = [
        "High quality material",
        "Long battery life",
        "Fast performance",
        "1 Year Warranty"
      ];

      return (

        <div className="itemdetailes">

          {/* Top Section */}

          <div className="layout-container">

            {/* Left Images */}

            <div className="image-section">

              <div className="thumbnail-list">

                {images.map((img, index) => (

                  <img
                    key={index}
                    src={img}
                    className={`thumb ${mainImage === img ? "active" : ""}`}
                    onClick={() => setMainImage(img)}
                  />

                ))}

              </div>

              <div className="featured-view">

                <img
                  id="main-display"
                  src={mainImage}
                  alt="Main Product"
                />

              </div>

            </div>

            {/* Product Info */}

            <div className="product-info">

              <h1>Gaming Laptop</h1>

              <p className="price">
                ₹59,999
              </p>

              <p className="rating">
                ⭐⭐⭐⭐☆ 4.5 Ratings
              </p>

              <p>
                High performance laptop with fast processor,
                SSD storage and premium build quality.
              </p>

              <button className="cart-btn">
                Add to Cart
              </button>

              <button className="buy-btn">
                Buy Now
              </button>

            </div>

          </div>

          {/* Important Info */}

          <div className="product-features">

            <h2>Important Information</h2>

            <ul>

              {features.map((feature, index) => (
                <li key={index}>
                  {feature}
                </li>
              ))}

            </ul>

          </div>

          {/* Specifications */}

          <div className="product-specifications">

            <h2>Product Specifications</h2>

            <p>
              Intel i7 Processor, 16GB RAM,
              512GB SSD, RTX Graphics,
              Windows 11.
            </p>

          </div>

          {/* Similar Products */}

          <div className="similar-products">

            <h2>Similar Products</h2>

            <div className="similar-grid">

              {similarProducts.map((product, index) => (

                <div
                  className="product-card"
                  key={index}
                >

                  <img src={product.image} />

                  <p>{product.name}</p>

                </div>

              ))}

            </div>

          </div>

          {/* Reviews */}

          <div className="reviews">

            <h2>Customer Reviews</h2>

            <div className="review">

              <p>
                <strong>John:</strong>
                Great product. Highly recommended.
              </p>

            </div>

            <div className="review">

              <p>
                <strong>Jane:</strong>
                Worth the price.
              </p>

            </div>

          </div>

        </div>

      );
    }

    /* ================= INFO ================= */

    function Info() {

      return (

        <>

          <div className="back-top">

            <button>
              Back to top
            </button>

          </div>

          <div className="info">

            <div className="link">

              <h2>Get to know us</h2>

              <a href="#">About</a>
              <a href="#">Careers</a>

            </div>

            <div className="link">

              <h2>Connect</h2>

              <a href="#">Instagram</a>
              <a href="#">Facebook</a>

            </div>

            <Link />

          </div>

        </>

      );
    }

    function Link() {

      return (

        <div className="link">

          <a href="#">Market Pay</a>
          <a href="#">Gift Cards</a>
          <a href="#">Audible</a>

        </div>

      );
    }

    /* ================= FOOTER ================= */

    function Footer() {

      return (

        <div id="footer">
          © 2026 Market.in
        </div>

      );
    }

    /* ================= APP ================= */

    function App() {

      return (

        <>

          <Header />

          <Option />

          <Itemdetailes />

          <div className="info-footer">
            <Info />
          </div>

          <Footer />

        </>

      );
    }

    const root = ReactDOM.createRoot(
      document.querySelector(".js-container")
    );

    root.render(<App />);

  </script>

</body>
</html>
