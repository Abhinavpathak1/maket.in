<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Market.in Search Results</title>

  <link rel="stylesheet" href="searchresult.css" />

</head>

<body>

  <div class="js-container"></div>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>

  <!-- React DOM -->
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">

    /* =========================
       LARGE PRODUCT DATA
    ========================== */

    const products = Array.from({ length: 48 }, (_, index) => ({

      id: index + 1,

      image:
        "https://via.placeholder.com/300x250",

      brand:
        "Market Brand",

      name:
        `Laptop Model ${index + 1}`,

      price:
        `$${999 + index}`,

      rating:
        (4 + Math.random()).toFixed(1),

      description:
        "High-performance laptop with premium build quality and powerful features."

    }));


    /* =========================
       HEADER
    ========================== */

    function Header({ onSearch }) {

  const [query, setQuery] = React.useState("");

  function handleSubmit(e) {
    e.preventDefault();
    onSearch(query);
  }

  return (
    <div className="header">

      <h2>Market.in</h2>

      <form className="search-bar" onSubmit={handleSubmit}>
        <input
          type="text"
          placeholder="Search products..."
          value={query}
          onChange={(e) => setQuery(e.target.value)}
        />
        <button type="submit">Search</button>
      </form>

      <div>
        <button>Login</button>
        <button>Orders</button>
        <button>Cart</button>
      </div>

    </div>
  );
}

/* ================= SIDEBAR ================= */
function Sidebar() {

  const [isOpen, setIsOpen] = React.useState(false);

  return (
    <>
      <button onClick={() => setIsOpen(true)}>☰ Menu</button>

      {isOpen && (
        <div className="overlay" onClick={() => setIsOpen(false)}></div>
      )}

      <div className={`sidebar ${isOpen ? "open" : ""}`}>
        <h2>Hello User</h2>
        <button onClick={() => setIsOpen(false)}>X</button>

        <h3>Categories</h3>
        <a href="#">Mobiles</a><br/>
        <a href="#">Fashion</a><br/>
        <a href="#">Books</a><br/>
      </div>
    </>
  );
}

/* ================= PRODUCT CARD ================= */
function ProductCard(product) {
  return (
    <div className="product-card">
      <img src={product.image} width="100%" />

      <h4>{product.brand}</h4>
      <h3>{product.name}</h3>
      <p>⭐ {product.rating}</p>
      <p>₹{product.price}</p>
      <p>{product.description}</p>

      <button>Add to Cart</button>
    </div>
  );
}

/* ================= PRODUCT LIST ================= */
function ProductList({ products }) {
  return (
    <div className="product-list">
      {products.map(p => (
        <ProductCard key={p.id} {...p} />
      ))}
    </div>
  );
}

/* ================= APP ================= */
function App() {

  const [products, setProducts] = React.useState([]);

  async function fetchProducts(search = "") {
    try {
      const res = await fetch(
        `http://localhost:3000/api/products?search=${search}`
      );

      const data = await res.json();
      setProducts(data);

    } catch (err) {
      console.error("Fetch error:", err);
    }
  }

  React.useEffect(() => {
    fetchProducts(); // load all
  }, []);

  return (
    <>
      <Header onSearch={fetchProducts} />
      <Sidebar />
      <ProductList products={products} />
    </>
  );
}


    ReactDOM
      .createRoot(
        document.querySelector(".js-container")
      )
      .render(<App />);

  </script>

</body>

</html>
